<!DOCTYPE html>
<html lang="{{ current_language }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ t('web.gallery.empty.page_title') }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='theme.css') }}">
    <style>
        .empty-shell {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .empty-card {
            width: min(560px, 100%);
            padding: 32px;
            text-align: center;
        }

        .empty-icon {
            font-size: 72px;
            line-height: 1;
            margin-bottom: 18px;
        }

        .empty-card p {
            margin: 10px 0 0;
            color: var(--text-secondary);
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <main class="page-shell">
        <div class="page-container">
            <section class="page-hero">
                <div>
                    <span class="eyebrow">{{ t('web.gallery.title') }}</span>
                </div>
                <div class="actions">
                    <a href="/stats" class="btn btn-primary">{{ t('web.gallery.stats') }}</a>
                    <a href="/admin" class="btn btn-ghost">{{ t('web.gallery.admin') }}</a>
                </div>
            </section>

            <section class="empty-shell">
                <section class="panel empty-card">
                    <div class="empty-icon">📸</div>
                    <span class="eyebrow">{{ t('web.gallery.title') }}</span>
                    <h1>{{ t('web.gallery.empty.title') }}</h1>
                    <p>{{ t('web.gallery.empty.description') }}</p>
                </section>
            </section>
        </div>
    </main>
</body>
</html>
